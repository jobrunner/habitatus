# CodeQL analysis. The repository ruleset "protect-main" carries a
# code_scanning rule naming CodeQL specifically, with thresholds "errors" and
# "high_or_higher" — without this workflow that rule has no results to judge
# and blocks every merge, which is how its absence was noticed.
#
# CodeQL complements the linters rather than repeating them: golangci-lint
# reasons within a function, CodeQL follows data across the program, which is
# what finds a tainted value reaching a sink several calls away.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-analyse weekly: queries improve even when the code does not.
    - cron: '0 6 * * 2'

permissions:
  contents: read

# GitHub's implicit shell is `bash -e`, without pipefail: a failing command in
# a pipeline is reported as the success of the last one. Every workflow in this
# repository declares `bash`, which is `bash --noprofile --norc -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # required to publish results to code scanning
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version: '1.26.8'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is the broadest suite; the service has no
          # third-party code, so the extra queries cost little to run.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

      - name: Analyse
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}
