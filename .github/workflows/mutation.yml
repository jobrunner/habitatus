# Mutation testing. Coverage says a line ran; mutation says a test would have
# caught a bug in it. The evaluator is the package where that distinction
# matters most: it is the part whose correctness the golden master asserts, and
# a test that merely executes it proves nothing.
#
# The thresholds are a RATCHET — raise them as the tests improve, and treat
# lowering one as a decision that needs an argument in the PR. Measured at
# the time of writing: efficacy 81.8 %, mutator coverage 90.4 %.
name: Mutation

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'internal/esy/**'

permissions:
  contents: read

# GitHub's implicit shell is `bash -e`, without pipefail: a failing command
# piped into tee reports the exit status of tee, which is always 0. That is
# how this job first reported green while gremlins was failing outright.
# The `bash` keyword means `bash --noprofile --norc -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  gremlins:
    name: gremlins (evaluator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

      - name: Mutate the evaluator
        run: |
          # Thresholds come from .mutation-thresholds, which
          # scripts/ratchet-baseline.py watches. Inlining them here would put
          # them out of that guard's reach.
          eff=$(awk '$1=="efficacy"{print $2}' .mutation-thresholds)
          mc=$(awk '$1=="mcover"{print $2}' .mutation-thresholds)
          # The path is a directory, not a pattern: gremlins appends /...
          # itself, so ./internal/esy/... becomes ./internal/esy/.../... and
          # matches nothing — which it reports as a coverage failure.
          #
          # The timeout coefficient matters as much. gremlins derives each
          # mutant's timeout from the baseline test run, and for a package
          # this fast the derived value is shorter than a mutant's compile:
          # at the default, 63 of 66 mutants timed out and the score was
          # noise (efficacy "100%" from three killed mutants).
          gremlins unleash ./internal/esy \
            --timeout-coefficient=20 \
            --threshold-efficacy="$eff" --threshold-mcover="$mc" \
            2>&1 | tee mutation.log

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report
          path: mutation.log
