# Mutation testing. Coverage says a line ran; mutation says a test would have
# caught a bug in it. The evaluator is the package where that distinction
# matters most: it is the part whose correctness the golden master asserts, and
# a test that merely executes it proves nothing.
#
# The thresholds are a RATCHET — raise them as the tests improve, and treat
# lowering one as a decision that needs an argument in the PR.
name: Mutation

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'internal/esy/**'

permissions:
  contents: read

jobs:
  gremlins:
    name: gremlins (evaluator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest

      - name: Mutate the evaluator
        run: |
          gremlins unleash ./internal/esy/... \
            --threshold-efficacy=70 --threshold-mcover=80 \
            2>&1 | tee mutation.log

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: mutation.log
