name: CI

# The ESy rule file is now vendored (data/esy/, CC BY 4.0 — see
# data/esy/ATTRIBUTION.md), so `make check` runs here too: build, vet,
# formatting, the unit suite, and the real-file tests gated behind ESY_FILE
# (internal/rulepack and internal/classify).
#
# `make golden` still does not run here. It needs both R and the upstream
# clone (spike/ESy-upstream) — neither is available in this environment —
# and takes about ten minutes to compare 11,337 plots against the R oracle
# for both evaluation modes. That command is run locally before a merge; see
# the "Pre-Merge-Gate" section of README.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        # gofmt -l prints the unformatted files and still exits 0, so the
        # output itself has to be turned into the failure.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Check (real-file tests against the vendored rule file)
        run: make check
