name: CI

# This workflow runs the self-contained part of the suite only.
#
# Two of the project's checks cannot run here, and pretending otherwise would
# be worse than leaving them out:
#
#   * `make check` needs ESY_FILE — the ESy expert-system rule file. It is not
#     in this repository, so every test gated behind ESY_FILE (the real-file
#     tests in internal/rulepack and internal/classify) skips here. Note that
#     this is a choice, not a licence constraint: the file is CC BY 4.0 and
#     open access (doi:10.5281/zenodo.3841729). Vendoring it, or fetching it
#     here, would let these tests run in CI.
#   * `make golden` needs both that rule file and the golden-master fixtures,
#     which are regenerated by running the upstream R implementation
#     (spike/ESy-upstream) over 11,337 plots — an R toolchain plus the upstream
#     clone, and roughly five minutes of comparison.
#
# Both are run locally before a merge; see the "Pre-Merge-Gate" section of
# README.md. What CI guarantees is everything that needs no external data:
# the build, vet, formatting, and the unit suite.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        # gofmt -l prints the unformatted files and still exits 0, so the
        # output itself has to be turned into the failure.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ./...
