# Container release. Builds the image natively per architecture (no QEMU),
# pushes per-arch candidates, then merges them into one multi-arch manifest,
# signs it keylessly with cosign, and attaches an SBOM.
#
# The image is built from the single Dockerfile in the repository root: a
# multi-stage build onto distroless/static, running as nonroot, with the
# CC BY 4.0 ESy rule file vendored in at a fixed path.
name: Docker Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(head -n1 VERSION | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: [version]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the per-arch candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

  merge:
    name: Merge and sign
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing via the OIDC token
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Merge the per-arch candidates into one manifest
        run: |
          src="${REGISTRY}/${IMAGE_NAME}"
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            docker buildx imagetools create -t "$tag" \
              "${src}:ci-amd64" "${src}:ci-arm64"
          done

      - name: Sign the manifest
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}"); do
            digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | tr -d '"')
            cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${digest}"
          done

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Signed keylessly with cosign; SLSA provenance and an SPDX SBOM are attached as attestations."
            echo
            echo "Verify:"
            echo '```'
            echo "cosign verify ${REGISTRY}/${IMAGE_NAME}:${{ needs.version.outputs.version }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${IMAGE_NAME}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "cosign download sbom ${REGISTRY}/${IMAGE_NAME}:${{ needs.version.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
