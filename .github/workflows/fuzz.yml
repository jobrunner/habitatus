# Nightly fuzzing of the rule-file parsers. The CI job budgets executions as a
# smoke test; this one runs on a clock, long enough to reach inputs a smoke
# test never does. A crash is committed as a seed corpus entry by whoever
# triages it, so the CI job then covers it forever.
#
# One failure here is NOT a crash: "context deadline exceeded" with no crasher
# in the artifact is Go's fuzzing shutdown racing its own deadline. Check the
# artifact before hunting for a bug that is not there.
name: Fuzz

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Duration per target'
        required: false
        default: '10m'

permissions:
  contents: read

# GitHub's implicit shell is `bash -e`, without pipefail: a failing command in
# a pipeline is reported as the success of the last one. Every workflow in this
# repository declares `bash`, which is `bash --noprofile --norc -eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzParseExpr, FuzzParseFormula, FuzzSplitSections, FuzzLoad]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'

      # The dispatch input goes through the environment, never through string
      # interpolation into the script: a value containing a quote would
      # otherwise close the quoting and run as a command on the runner.
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          FUZZTIME: ${{ github.event.inputs.fuzztime || '10m' }}
        run: |
          go test -run '^$' -fuzz "$TARGET" -fuzztime="$FUZZTIME" ./internal/rulepack/

      - name: Upload the crashing corpus, if any
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: internal/rulepack/testdata/fuzz/
          if-no-files-found: ignore
