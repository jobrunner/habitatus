# gitleaks config for habitatus. Starts from the built-in ruleset and allowlists
# the paths that legitimately hold secret-shaped strings: the vendored rule file
# (165,260 lines of taxon names, some of which look like high-entropy tokens),
# the golden-master fixtures, and the docs. Real secrets in real source still
# fail the Secret Scan job.
title = "habitatus gitleaks config"

[extend]
useDefault = true

# Only the two DATA directories are exempt, and for one concrete reason: the
# vendored rule file is 165,260 lines of taxon names and codes, some of which
# trip entropy rules, and the golden-master fixtures are generated from it.
# Prose is NOT exempt — allowlisting README, CHANGELOG and docs/ wholesale
# would disable every rule for them, so a credential pasted into a document
# would pass a gate that claims to catch exactly that.
[allowlist]
description = "The vendored rule file and the fixtures generated from it. Everything else, including all source and all prose, is scanned."
paths = [
  '''(^|/)testdata/''',
  '''(^|/)data/esy/''',
]
